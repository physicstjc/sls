<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV Question Results Summary</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--card:#0d1929;--line:rgba(148,163,184,.18);--text:#f4f7fb;--muted:#91a2b8;--accent:#2dd4bf;--good:#4ade80}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% -8%,rgba(45,212,191,.15),transparent 32rem),radial-gradient(circle at 100% 0,rgba(59,130,246,.1),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    header{border-bottom:1px solid var(--line);background:rgba(7,16,29,.82);backdrop-filter:blur(18px)}.inner,main{width:min(1180px,calc(100% - 32px));margin:auto}.inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(45,212,191,.3);border-radius:13px;background:rgba(45,212,191,.11);color:#5eead4;font-size:20px}h1{margin:0;font-size:18px}.subtitle{margin:3px 0 0;color:var(--muted);font-size:12px}
    a,button,select{min-height:40px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(148,163,184,.07);color:#dce6f2;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}a:hover,button:hover{border-color:rgba(45,212,191,.5);background:rgba(45,212,191,.09)}.actions,.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    main{padding:32px 0 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h2{margin:5px 0;font-size:clamp(25px,4vw,38px);letter-spacing:-.04em}.hero p,.controls label{margin:0;color:var(--muted);font-size:13px}.notice{padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--muted);text-align:center}.notice strong{display:block;margin-bottom:6px;color:var(--text);font-size:17px}.notice code{color:#5eead4}.notice.error{border-color:rgba(251,113,133,.35)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric,.question{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(11,24,40,.97))}.metric{padding:18px;border-radius:15px}.label{color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}.value{margin-top:4px;font-size:25px;font-weight:800}.note{color:var(--muted);font-size:11px}
    .questions{display:grid;gap:12px}.question{display:grid;grid-template-columns:110px minmax(150px,1fr) minmax(280px,2.1fr);gap:22px;align-items:center;padding:18px 20px;border-radius:16px}.qtitle{font-size:17px;font-weight:780}.key{margin-top:4px;color:var(--muted);font-size:12px}.key strong{color:#5eead4}.rate{font-size:27px;font-weight:820}.count{color:var(--muted);font-size:11px}.track{height:7px;margin-top:8px;overflow:hidden;border-radius:999px;background:rgba(148,163,184,.13)}.track span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#14b8a6,#5eead4)}
    .choices{display:grid;grid-template-columns:repeat(6,minmax(38px,1fr));gap:7px}.choice{padding:8px 5px;border:1px solid var(--line);border-radius:9px;background:rgba(3,10,20,.35);text-align:center}.choice.correct{border-color:rgba(74,222,128,.42);background:rgba(74,222,128,.08)}.choice .name{display:block;color:var(--muted);font-size:9px;font-weight:800}.choice.correct .name{color:var(--good)}.choice b{display:block;margin-top:2px;font-size:14px}.choice small{display:block;color:var(--muted);font-size:9px}
    @media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.question{grid-template-columns:90px 1fr}.choices{grid-column:1/-1}.hero{align-items:flex-start;flex-direction:column}}
    @media(max-width:520px){.inner{padding:12px 0;align-items:flex-start;flex-direction:column}.question{grid-template-columns:1fr;gap:12px}.choices{grid-column:auto;grid-template-columns:repeat(3,1fr)}}
    @media print{body{background:#fff;color:#111}header,.controls{display:none}main{width:100%;padding:0}.metric,.question,.choice{background:#fff;border-color:#bbb}.question{break-inside:avoid}.hero p,.label,.note,.key,.count,.choice .name,.choice small{color:#555}}
  </style>
</head>
<body>
  <header><div class="inner"><div class="brand"><div class="mark" aria-hidden="true">CSV</div><div><h1>CSV Question Summary</h1><p class="subtitle">Source: oms-marks-for-check.csv</p></div></div><div class="actions"><a href="scanner.html">Back to scanner</a><button id="print">Print summary</button></div></div></header>
  <main><div class="hero"><div><div class="eyebrow">Exported item analysis</div><h2>Question performance from CSV</h2><p id="description">Loading <code>oms-marks-for-check.csv</code>…</p></div><div class="controls"><label for="sort">Sort by</label><select id="sort"><option value="number">Question number</option><option value="lowest">Lowest score first</option><option value="highest">Highest score first</option><option value="blank">Most blanks first</option></select><button id="reload">Reload CSV</button></div></div><div id="content" aria-live="polite"><div class="notice">Loading CSV results…</div></div></main>
  <script>
    const DATA_FILE="oms-marks-for-check.csv",content=document.getElementById("content"),sort=document.getElementById("sort");let summaries=[];
    function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=""}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);field="";if(row.some(Boolean))rows.push(row);row=[]}else field+=c}if(field.length||row.length){row.push(field);rows.push(row)}return rows}
    function normalize(value){const found=String(value||"").toUpperCase().match(/[A-E]/g)||[];return[...new Set(found)].sort().join("+")}
    async function load(){content.innerHTML='<div class="notice">Loading CSV results…</div>';try{const response=await fetch(DATA_FILE,{cache:"no-store"});if(!response.ok)throw new Error(`Could not load ${DATA_FILE} (${response.status}).`);const rows=parseCSV((await response.text()).replace(/^\uFEFF/,""));if(rows.length<2)throw new Error("The CSV contains no student results.");const headers=rows[0].map(value=>value.trim()),questions=headers.map((heading,column)=>({heading,column})).filter(item=>/^Q\d+$/i.test(item.heading)).sort((a,b)=>Number(a.heading.slice(1))-Number(b.heading.slice(1)));if(!questions.length)throw new Error("No question columns such as Q1 or Q2 were found.");const data=rows.slice(1);summaries=questions.map((question,index)=>{const resultColumn=headers.findIndex(h=>h.toLowerCase()===`${question.heading} result`.toLowerCase()),correctColumn=headers.findIndex(h=>h.toLowerCase()===`${question.heading} correct answer`.toLowerCase()),counts={A:0,B:0,C:0,D:0,E:0,Blank:0,Multi:0};let correctCount=0,correct="";data.forEach(cells=>{const answer=normalize(cells[question.column]),result=String(cells[resultColumn]||"").trim().toLowerCase(),correction=normalize(cells[correctColumn]);if(!answer)counts.Blank++;else if(Object.hasOwn(counts,answer))counts[answer]++;else counts.Multi++;if(result==="correct"){correctCount++;if(!correct&&answer)correct=answer}else if(correction)correct=correction});return{number:Number(question.heading.slice(1))||index+1,total:data.length,correctCount,correct,rate:correctCount/data.length,blankRate:counts.Blank/data.length,counts}});document.getElementById("description").textContent=`${data.length} ${data.length===1?"student":"students"} across ${summaries.length} questions, read from ${DATA_FILE}.`;const average=summaries.reduce((sum,q)=>sum+q.rate,0)/summaries.length,totalAnswers=data.length*summaries.length,blanks=summaries.reduce((sum,q)=>sum+q.counts.Blank,0);content.innerHTML=`<section class="metrics"><div class="metric"><div class="label">Students</div><div class="value">${data.length}</div><div class="note">CSV data rows</div></div><div class="metric"><div class="label">Questions</div><div class="value">${summaries.length}</div><div class="note">Detected question columns</div></div><div class="metric"><div class="label">Average accuracy</div><div class="value">${Math.round(average*100)}%</div><div class="note">From CSV result fields</div></div><div class="metric"><div class="label">Completion</div><div class="value">${Math.round((totalAnswers-blanks)/totalAnswers*100)}%</div><div class="note">${blanks} blank responses</div></div></section><section class="questions" id="questions"></section>`;render()}catch(error){content.innerHTML=`<div class="notice error"><strong>CSV could not be loaded</strong>${error.message}<br><br>Open this page through a local web server so the browser can fetch <code>${DATA_FILE}</code>.</div>`}}
    function render(){const list=[...summaries],mode=sort.value;if(mode==="lowest")list.sort((a,b)=>a.rate-b.rate||a.number-b.number);else if(mode==="highest")list.sort((a,b)=>b.rate-a.rate||a.number-b.number);else if(mode==="blank")list.sort((a,b)=>b.blankRate-a.blankRate||a.number-b.number);const names=["A","B","C","D","E","Blank","Multi"];document.getElementById("questions").innerHTML=list.map(q=>{const percent=Math.round(q.rate*100),choices=names.filter(name=>name!=="Multi"||q.counts.Multi).map(name=>`<div class="choice ${q.correct===name?"correct":""}"><span class="name">${name.toUpperCase()}</span><b>${q.counts[name]}</b><small>${Math.round(q.counts[name]/q.total*100)}%</small></div>`).join("");return`<article class="question"><div><div class="qtitle">Question ${q.number}</div><div class="key">Correct answer: <strong>${q.correct||"Not recorded"}</strong></div></div><div><div><span class="rate">${percent}%</span> <span class="count">${q.correctCount} of ${q.total} correct</span></div><div class="track"><span style="width:${percent}%"></span></div></div><div class="choices">${choices}</div></article>`}).join("")}
    sort.addEventListener("change",render);document.getElementById("reload").addEventListener("click",load);document.getElementById("print").addEventListener("click",()=>window.print());load();
  </script>
</body>
</html>
